<!DOCTYPE html>
<html>
<head>

<title>Delete Product</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

<h1>Delete Product</h1>

<h2>Are you sure you want to delete this product?</h2>

<br>

<table>

<tr>
<th>ID</th>
<td>{{ product.id }}</td>
</tr>

<tr>
<th>Name</th>
<td>{{ product.name }}</td>
</tr>

<tr>
<th>Category</th>
<td>{{ product.category }}</td>
</tr>

<tr>
<th>Quantity</th>
<td>{{ product.quantity }}</td>
</tr>

<tr>
<th>Price</th>
<td>₹ {{ product.price }}</td>
</tr>

<tr>
<th>Description</th>
<td>{{ product.description }}</td>
</tr>

</table>

<br>

{% if product.image %}

<img
src="{{ url_for('static', filename='uploads/' + product.image) }}"
width="220">

<br><br>

{% endif %}

<a href="/delete/{{ product.id }}">
<button class="delete-btn">
Delete Product
</button>
</a>

<a href="/products">
<button>
Cancel
</button>
</a>

</div>

</body>
</html>
