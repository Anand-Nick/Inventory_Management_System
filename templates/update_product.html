<!DOCTYPE html>
<html>
<head>

<title>Update Product</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

<h1>Update Product</h1>

<form method="POST"
enctype="multipart/form-data">

<label>Product Name</label>

<input
type="text"
name="name"
value="{{ product.name }}"
required>

<label>Category</label>

<select name="category">

<option {% if product.category=="Electronics" %}selected{% endif %}>Electronics</option>

<option {% if product.category=="Groceries" %}selected{% endif %}>Groceries</option>

<option {% if product.category=="Medical" %}selected{% endif %}>Medical</option>

<option {% if product.category=="Clothing" %}selected{% endif %}>Clothing</option>

<option {% if product.category=="Furniture" %}selected{% endif %}>Furniture</option>

<option {% if product.category=="Fruits" %}selected{% endif %}>Fruits</option>

<option {% if product.category=="Stationery" %}selected{% endif %}>Stationery</option>

</select>

<label>Quantity</label>

<input
type="number"
name="quantity"
value="{{ product.quantity }}"
required>

<label>Price</label>

<input
type="number"
step="0.01"
name="price"
value="{{ product.price }}"
required>

<label>Description</label>

<textarea
name="description"
rows="5">{{ product.description }}</textarea>

{% if product.image %}

<img
src="{{ url_for('static', filename='uploads/' + product.image) }}"
width="180">

{% endif %}

<label>Change Image</label>

<input
type="file"
name="image"
accept="image/*">

<br><br>

<button type="submit">
Update Product
</button>

<a href="/products">
<button type="button">
Cancel
</button>
</a>

</form>

</div>

</body>
</html>
