<!DOCTYPE html>
<html>
<head>

<title>Product Details</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

<h1>Product Details</h1>

{% if product.image %}

<img
src="{{ url_for('static', filename='uploads/' + product.image) }}"
width="250">

{% endif %}

<table>

<tr>

<th>ID</th>

<td>{{ product.id }}</td>

</tr>

<tr>

<th>Name</th>

<td>{{ product.name }}</td>

</tr>

<tr>

<th>Category</th>

<td>{{ product.category }}</td>

</tr>

<tr>

<th>Quantity</th>

<td>{{ product.quantity }}</td>

</tr>

<tr>

<th>Price</th>

<td>₹ {{ product.price }}</td>

</tr>

<tr>

<th>Description</th>

<td>{{ product.description }}</td>

</tr>

</table>

<br>

<a href="/update/{{ product.id }}">
<button>Update</button>
</a>

<a href="/delete/{{ product.id }}">
<button>Delete</button>
</a>

<a href="/products">
<button>Back</button>
</a>

</div>

</body>
</html>
